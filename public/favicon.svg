<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fcfbfa" />
      <stop offset="100%" stop-color="#f5f2ed" />
    </radialGradient>

    <!-- Amber Crystal Glow Gradient -->
    <linearGradient id="amberSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Amber Bright Highlight -->
    <linearGradient id="amberHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Dark Chocolate / Obsidian Gradient for TK -->
    <linearGradient id="tkDark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3d2c25" />
      <stop offset="25%" stop-color="#1c1613" />
      <stop offset="70%" stop-color="#0f0c0b" />
      <stop offset="100%" stop-color="#2a1e19" />
    </linearGradient>

    <!-- TK Specular Highlight -->
    <linearGradient id="tkShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Tendo Gel Text Gradient -->
    <linearGradient id="tendoGel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ruler Translucent Gradient -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D depth -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="7" stdDeviation="5" flood-color="#1f1815" flood-opacity="0.45" />
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#d97706" flood-opacity="0.25" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container (rounded modern tile) -->
  <rect width="500" height="500" rx="60" fill="url(#bgGlow)" />

  <!-- Outer Particle Sparkle Ring (Amber & Dark Sugar Crystals) -->
  <g opacity="0.85">
    <circle cx="95" cy="275" r="3.5" fill="#f59e0b" />
    <circle cx="85" cy="295" r="2.5" fill="#1c1613" />
    <circle cx="105" cy="315" r="3" fill="#d97706" />
    <circle cx="75" cy="330" r="2" fill="#f59e0b" />
    <circle cx="90" cy="345" r="4" fill="#b45309" />
    <circle cx="120" cy="355" r="2.5" fill="#1c1613" />
    <circle cx="80" cy="365" r="3" fill="#f59e0b" />
    <circle cx="105" cy="380" r="3.5" fill="#fbbf24" />
    <circle cx="130" cy="390" r="2" fill="#1c1613" />

    <circle cx="405" cy="275" r="3.5" fill="#f59e0b" />
    <circle cx="415" cy="295" r="2.5" fill="#1c1613" />
    <circle cx="395" cy="315" r="3" fill="#d97706" />
    <circle cx="425" cy="330" r="2" fill="#f59e0b" />
    <circle cx="410" cy="345" r="4" fill="#b45309" />
    <circle cx="380" cy="355" r="2.5" fill="#1c1613" />
    <circle cx="420" cy="365" r="3" fill="#f59e0b" />
    <circle cx="395" cy="380" r="3.5" fill="#fbbf24" />
    <circle cx="370" cy="390" r="2" fill="#1c1613" />

    <circle cx="140" cy="425" r="3" fill="#f59e0b" />
    <circle cx="160" cy="435" r="2" fill="#1c1613" />
    <circle cx="340" cy="435" r="3" fill="#d97706" />
    <circle cx="360" cy="425" r="2" fill="#f59e0b" />
  </g>

  <!-- ================= SWOOSHES ================= -->
  <!-- Upper Dark Crescent Swoosh -->
  <path d="M 180 145 C 240 100 315 115 355 155 C 330 140 280 130 220 150 C 200 156 185 160 170 170 Z" 
        fill="url(#tkDark)" filter="url(#shadow3d)" />

  <!-- Outer Amber Candied Crystal Swoosh -->
  <path d="M 270 85 C 335 90 395 140 405 210 C 412 260 380 320 310 360 C 375 305 385 230 350 165 C 325 120 295 95 270 85 Z" 
        fill="url(#amberSwoosh)" filter="url(#shadow3d)" />

  <!-- Amber Swoosh Sparkle Highlight -->
  <path d="M 285 92 C 340 105 380 145 390 200 C 375 160 345 125 300 105 Z" 
        fill="url(#amberHighlight)" />

  <!-- Lower Sleek Dark Swoosh embracing the K -->
  <path d="M 215 305 C 290 295 365 240 390 175 C 380 230 310 290 225 305 Z" 
        fill="url(#tkDark)" filter="url(#shadow3d)" />

  <!-- ================= 3D EMBOSSED "TK" MONOGRAM ================= -->
  <g filter="url(#shadow3d)">
    <!-- Letter 'T' -->
    <!-- Top Bar -->
    <path d="M 120 150 C 115 150 110 156 110 162 L 110 170 C 110 176 115 182 120 182 L 152 182 L 152 250 C 152 256 157 262 163 262 L 179 262 C 185 262 190 256 190 250 L 190 182 L 222 182 C 228 182 233 176 233 170 L 233 162 C 233 156 228 150 222 150 Z" 
          fill="url(#tkDark)" />
    <!-- 'T' Top Bevel Reflection -->
    <path d="M 115 155 C 114 157 115 160 118 160 L 225 160 C 228 160 229 157 228 155 C 225 152 220 151 215 151 L 128 151 C 122 151 117 153 115 155 Z" 
          fill="url(#tkShine)" />
    <!-- 'T' Vertical Shine -->
    <path d="M 156 182 L 164 182 L 164 248 L 156 248 Z" fill="#ffffff" opacity="0.15" />

    <!-- Letter 'K' -->
    <!-- Vertical Spine -->
    <path d="M 200 152 C 194 152 190 157 190 163 L 190 250 C 190 256 194 262 200 262 L 216 262 C 222 262 226 256 226 250 L 226 163 C 226 157 222 152 216 152 Z" 
          fill="url(#tkDark)" />
    <!-- Diagonal Arms of K -->
    <!-- Upper Diagonal -->
    <path d="M 218 205 L 268 156 C 272 152 278 152 284 156 L 298 168 C 302 172 302 178 298 182 L 246 224 L 218 205 Z" 
          fill="url(#tkDark)" />
    <!-- Lower Diagonal -->
    <path d="M 235 214 L 294 250 C 298 253 302 258 300 263 L 292 273 C 290 277 284 278 279 275 L 215 233 Z" 
          fill="url(#tkDark)" />

    <!-- 'K' Gloss highlights -->
    <path d="M 226 160 L 265 158 C 270 158 274 161 278 165 L 245 192 Z" fill="#ffffff" opacity="0.25" />
    <path d="M 245 220 L 285 245 C 290 248 293 252 291 256 L 260 236 Z" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- ================= HEADLINE: TENDO LA KRISTO ================= -->
  <g filter="url(#shadow3d)">
    <text x="250" y="340" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="url(#tendoGel)">
      TENDO LA KRISTO
    </text>
  </g>

  <!-- ================= SUBTITLE: AMOS STATIONERY ================= -->
  <g filter="url(#softGlow)">
    <text x="250" y="375" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="800" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#1c1613">
      AMOS STATIONERY
    </text>
  </g>

  <!-- ================= MINI STATIONERY ACCENTS (BOTTOM) ================= -->
  <!-- Miniature Wooden Pencil (Left) -->
  <g transform="translate(75, 360) rotate(35)" filter="url(#shadow3d)">
    <!-- Eraser (Pink) -->
    <path d="M 0 0 L 14 0 C 14 -6 0 -6 0 0 Z" fill="#f472b6" />
    <!-- Metal Ferrule (Silver) -->
    <rect x="0" y="0" width="14" height="6" fill="#94a3b8" />
    <line x1="0" y1="3" x2="14" y2="3" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Pencil Body (Amber / Black facets) -->
    <rect x="0" y="6" width="5" height="32" fill="#d97706" />
    <rect x="5" y="6" width="4" height="32" fill="#fbbf24" />
    <rect x="9" y="6" width="5" height="32" fill="#b45309" />
    <!-- Sharpened Wood Collar -->
    <polygon points="0,38 14,38 7,52" fill="#fde68a" />
    <!-- Graphite Lead Tip -->
    <polygon points="5,48 9,48 7,54" fill="#0f172a" />
  </g>

  <!-- Miniature Leather Notebook -->
  <g transform="translate(160, 395) rotate(-12)" filter="url(#shadow3d)">
    <!-- Cover -->
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#451a03" />
    <!-- Spine band -->
    <rect x="0" y="0" width="6" height="40" rx="2" fill="#290e02" />
    <!-- White paper edges -->
    <rect x="6" y="3" width="22" height="34" rx="1" fill="#fef08a" opacity="0.9" />
    <!-- Bookmark ribbon -->
    <path d="M 16 0 L 16 22 L 20 18 L 24 22 L 24 0 Z" fill="#dc2626" opacity="0.85" />
  </g>

  <!-- Miniature Amber Translucent Ruler -->
  <g transform="translate(225, 395) rotate(-20)" filter="url(#shadow3d)">
    <rect x="0" y="0" width="65" height="18" rx="3" fill="url(#rulerGrad)" />
    <!-- Tick Marks -->
    <line x1="8" y1="0" x2="8" y2="7" stroke="#78350f" stroke-width="1.2" />
    <line x1="14" y1="0" x2="14" y2="4" stroke="#78350f" stroke-width="0.8" />
    <line x1="20" y1="0" x2="20" y2="7" stroke="#78350f" stroke-width="1.2" />
    <line x1="26" y1="0" x2="26" y2="4" stroke="#78350f" stroke-width="0.8" />
    <line x1="32" y1="0" x2="32" y2="7" stroke="#78350f" stroke-width="1.2" />
    <line x1="38" y1="0" x2="38" y2="4" stroke="#78350f" stroke-width="0.8" />
    <line x1="44" y1="0" x2="44" y2="7" stroke="#78350f" stroke-width="1.2" />
    <line x1="50" y1="0" x2="50" y2="4" stroke="#78350f" stroke-width="0.8" />
    <line x1="56" y1="0" x2="56" y2="7" stroke="#78350f" stroke-width="1.2" />
  </g>

  <!-- Miniature Sharpener / Eraser Block -->
  <g transform="translate(305, 400) rotate(15)" filter="url(#shadow3d)">
    <rect x="0" y="0" width="16" height="24" rx="3" fill="#1c1613" />
    <rect x="0" y="8" width="16" height="16" rx="2" fill="url(#amberSwoosh)" opacity="0.9" />
    <!-- Blade notch -->
    <circle cx="8" cy="4" r="2" fill="#cbd5e1" />
  </g>

  <!-- Miniature Black Paperclips (Right) -->
  <g transform="translate(390, 355) rotate(28)" filter="url(#shadow3d)">
    <path d="M 0 35 L 0 10 C 0 4 8 4 8 10 L 8 42 C 8 48 20 48 20 42 L 20 4 C 20 -4 -2 -4 -2 12 L -2 36" 
          fill="none" stroke="#1c1613" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(415, 385) rotate(22)" filter="url(#shadow3d)">
    <path d="M 0 25 L 0 8 C 0 3 6 3 6 8 L 6 30 C 6 35 15 35 15 30 L 15 3 C 15 -3 -2 -3 -2 9 L -2 26" 
          fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
